<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBT Gym Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f3fc;--sf:#ffffff;--ink:#0f2a43;--mu:#546f89;--ac:#1d76c4;--at:#1d76c4;--on:#ffffff;--soft:#d3e9fa;--ln:#b9d8f1;--ok:#1f7a5a;--warn:#a85a00;--wt:#ffffff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1d2d;--sf:#122f49;--ink:#e6f2fc;--mu:#9bb7cf;--ac:#5cb0f0;--at:#5cb0f0;--on:#08202f;--soft:#183c5c;--ln:#25526f;--ok:#6fd1a8;--warn:#f0b35c;--wt:#1c1500;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1d2d;--sf:#122f49;--ink:#e6f2fc;--mu:#9bb7cf;--ac:#5cb0f0;--at:#5cb0f0;--on:#08202f;--soft:#183c5c;--ln:#25526f;--ok:#6fd1a8;--warn:#f0b35c;--wt:#1c1500;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink)}
#app{background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh}
.top{max-width:560px;margin:0 auto;padding:10px 16px 0;text-align:right}
.pk{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 14px;background:var(--bg);border:1.5px solid var(--ln);border-radius:12px}
.pk .v{pointer-events:none;font-weight:600}
.pk .v.ph{color:var(--mu);font-weight:400}
.pk::after{content:"\25BE";color:var(--mu);pointer-events:none}
.pk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;margin:0;font-size:16px;cursor:pointer}
.pk:focus-within{outline:3px solid var(--at);outline-offset:1px}
main{max-width:560px;margin:0 auto;padding:4px 16px 110px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 2px;line-height:1.2}
h2{font-size:1.1rem;font-weight:800;margin:0 0 6px}
p{margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:14px 0}
.f{display:block;margin:12px 0}
.f>span{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
input[type=text],input[type=time],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--at);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 .92rem Nunito,system-ui,sans-serif;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:999px;padding:9px 14px;cursor:pointer;min-height:44px}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--at)}
.chip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dg .chip{padding:10px 0;text-align:center;font-size:.8rem}
.dot.pl i{box-shadow:inset 0 0 0 2px var(--at)}
.btn{font:800 1rem Nunito,system-ui,sans-serif;background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:13px 18px;min-height:48px;width:100%;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--soft);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--at);height:32px}
.sl{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:.92rem}
.sl b{font-size:1.2rem;color:var(--at)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--at)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;gap:4px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:100px;font:700 .8rem Nunito,system-ui,sans-serif;color:var(--mu);background:transparent;border:0;border-radius:12px;padding:10px 4px;min-height:46px;cursor:pointer}
nav button[aria-current=true]{background:var(--soft);color:var(--ink)}
.dots{display:flex;gap:6px;margin:10px 0}
.dot{flex:1;text-align:center;font-size:.78rem;color:var(--mu)}
.dot i{display:block;height:34px;border-radius:10px;background:var(--soft);margin-bottom:3px}
.dot.on i{background:var(--ac);border:2px solid var(--at)}
.dot.now{font-weight:800;color:var(--ink)}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--at);border-radius:99px}
.big{font-size:2.4rem;font-weight:800;line-height:1;color:var(--at)}
.note{border-left:4px solid var(--at);background:var(--soft);padding:10px 12px;border-radius:0 12px 12px 0;margin:12px 0}
.note.w{border-color:var(--warn)}
.rec{border-top:1px solid var(--ln);padding:10px 0;font-size:.92rem}
.rec:first-child{border-top:0}
.tm{font-size:3rem;font-weight:800;text-align:center;color:var(--at);font-variant-numeric:tabular-nums}
.x{float:right;background:none;border:0;color:var(--mu);font-size:1.1rem;cursor:pointer;min-height:44px;min-width:44px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cw{text-align:center;font-size:.75rem;color:var(--mu);font-weight:600}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--soft);font-size:.85rem;color:var(--ink)}
.cd.went{background:var(--ac);color:var(--on);font-weight:800;border:2px solid var(--at)}
.cd.short{background:var(--sf);border:2px solid var(--at);font-weight:800}
.cd.skipped{background:var(--sf);border:2px dashed var(--warn);color:var(--warn)}
.cd.now{box-shadow:0 0 0 2px var(--ink)}
.cm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cm h2{margin:0}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mu);margin-top:10px}
.lg i{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-right:4px;background:var(--soft)}
.lg i.a{background:var(--ac);border:2px solid var(--at)}.lg i.b{background:var(--sf);border:2px solid var(--at)}.lg i.c{background:var(--sf);border:2px dashed var(--warn)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<div id="app"><div class="top"><button class="chip" id="tg" type="button">Dark mode</button></div>
<main id="m"></main></div>
<nav id="nv"></nav>
<script>
var KEY='cbt-gym-v1',S={};
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.plan=S.plan||{};S.logs=S.logs||{};S.thoughts=S.thoughts||[];S.weeks=S.weeks||{};S.slips=S.slips||[];
var F={trap:'',after:5},tab='today',T={end:0,done:false,iv:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function iso(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
function td(){return iso(new Date())}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function mon(d){var x=new Date(d);x.setHours(12,0,0,0);return addD(x,-((x.getDay()+6)%7))}
function WK(){return iso(mon(new Date()))}
function did(k){var l=S.logs[k];return !!l&&(l.st==='went'||l.st==='short')}
function cnt(ws){var n=0;for(var i=0;i<7;i++)if(did(iso(addD(ws,i))))n++;return n}
function streak(){var w=mon(new Date()),n=0;if(cnt(w)>=4)n++;w=addD(w,-7);while(cnt(w)>=4&&n<520){n++;w=addD(w,-7)}return n}
function avgChange(){var a=[];for(var k in S.logs){var l=S.logs[k];if(typeof l.before==='number'&&typeof l.after==='number')a.push(l.after-l.before)}
return a.length?{n:a.length,v:a.reduce(function(x,y){return x+y},0)/a.length}:null}
function fld(l,p,rows){return '<label class="f"><span>'+l+'</span>'+(rows?'<textarea rows="'+rows+'" data-b="'+p+'"></textarea>':'<input type="text" data-b="'+p+'">')+'</label>'}
function sld(l,p){return '<div class="f"><div class="sl"><span>'+l+'</span><b data-out="'+p+'">—</b></div><input type="range" min="0" max="10" step="1" value="5" data-b="'+p+'" aria-label="'+l+'"></div>'}
function chips(list,sel,act){return '<div class="row">'+list.map(function(c){return '<button class="chip" data-act="'+act+'" data-v="'+esc(c[0])+'" aria-pressed="'+(sel===c[0])+'">'+c[1]+'</button>'}).join('')+'</div>'}
var ST=[['went','Went'],['short','Short session'],['rest','Rest day'],['skipped','Skipped']];
var TRAPS=[['All-or-nothing','All-or-nothing'],['Overgeneralization','Overgeneralization'],['Mental filter','Mental filter'],['Disqualifying the positive','Disqualifying the positive'],['Minimizing','Minimizing'],['Catastrophizing','Catastrophizing'],['Emotional reasoning','Emotional reasoning'],['Fortune telling','Fortune telling'],['Mind reading','Mind reading'],['Should statements','Should statements'],['Labeling','Labeling'],['Personalization','Personalization'],['Blaming','Blaming'],['Perfectionism','Perfectionism'],['Comparison','Comparison'],['Control fallacy','Control fallacy'],['Fairness fallacy','Fairness fallacy'],['Change fallacy','Change fallacy'],['Always being right','Always being right'],['Reward fallacy','Reward fallacy'],['Tomorrow thinking','Tomorrow thinking'],['Rationalizing','Rationalizing'],['Moral licensing','Moral licensing'],['Low frustration tolerance','Low frustration tolerance'],['What-if thinking','What-if thinking'],['Hopelessness','Hopelessness'],['Self-handicapping','Self-handicapping'],['Imposter thinking','Imposter thinking'],['Hindsight bias','Hindsight bias'],['Other','Other']];
var COMMON=[
['I\u2019m too tired.','Light movement often lifts energy. I\u2019ll start and decide after 10 minutes.'],
['If I can\u2019t do a full session, it\u2019s pointless.','A short session still builds the habit. My minimum version counts.'],
['It\u2019ll be a bad workout.','I can\u2019t predict that. I\u2019ll test it for 10 minutes and see.'],
['I don\u2019t feel motivated, so I shouldn\u2019t go.','Motivation usually follows action. I only need to decide whether to start.'],
['I missed a day, so this week is ruined.','One miss is information, not failure. I\u2019ll reschedule within 24 hours.']];
var OPT=[
['Light movement often lifts energy. I’ll start and decide after 10 minutes.','Feeling tired is not the same as being unable. I can do my minimum version.','Today is a gym day, so I’ll go and keep it gentle.'],
['A short session still builds the habit. My minimum version counts.','Showing up is the habit. Intensity can come later.','Twenty minutes is better than zero, and it keeps my streak alive.'],
['I can’t predict that. I’ll test it for 10 minutes and see.','Most of my past sessions felt better afterwards than I expected.','Even an average workout moves me toward my goal.'],
['Motivation usually follows action. I only need to decide whether to start.','I don’t need to feel like it. I need to follow the plan I made.','I’ll change into gym clothes and decide after 10 minutes.'],
['One miss is information, not failure. I’ll reschedule within 24 hours.','The week isn’t over. I can still reach 4 sessions.','My rule is never miss twice, so today is the day to go.']];
var TOPT={
'All-or-nothing':['It’s not all or nothing. A partial effort still counts.','One slip does not undo my progress.','I can do a smaller version today and keep going.'],
'Emotional reasoning':['A feeling is not a fact. I can feel unmotivated and still go.','My mood may change once I start moving.','I’ll act first and check how I feel after 10 minutes.'],
'Fortune telling':['I can’t know how it will go until I try.','I’ve been surprised by how I feel afterwards before.','I’ll test the prediction with a 10-minute trial.'],
'Perfectionism':['Good enough today beats perfect never.','My minimum version counts as a real session.','Consistency matters more than a perfect workout.'],
'Other':['What would I tell a friend in this situation?','What evidence do I have for and against this thought?','What is one small step I can take right now?'],
'':['What would I tell a friend in this situation?','What evidence do I have for and against this thought?','What is one small step I can take right now?']};
var TRAPM={
'All-or-nothing':'Seeing things in black and white: if it can’t be done fully or perfectly, it feels not worth doing.',
'Emotional reasoning':'Treating a feeling as proof, such as “I feel unmotivated, so I shouldn’t go.”',
'Fortune telling':'Predicting a bad outcome as if it were certain, such as “It’ll be a bad workout.”',
'Perfectionism':'Holding yourself to a standard where anything less than a full effort feels pointless.',
'Other':'A different unhelpful pattern, such as catastrophising or harsh self-criticism. Name it in your own words in the thought box.'};
function tmeaning(){return TM?'<div class="note"><b>'+TM+'.</b> '+TRAPM[TM]+'</div>':'<p class="mu" style="margin:8px 0 0">Long-press a trap to see what it means.</p>'}
function altList(){return (F.ci!==undefined&&COMMON[F.ci]&&F.thought===COMMON[F.ci][0])?OPT[F.ci]:(TOPT[F.trap||'']||TOPT[''])}
function altOpts(){return '<div class="f"><span>Balanced alternative options</span><p class="mu" style="margin:0 0 6px">Tap one to use it, or write your own below.</p>'+altList().map(function(t,i){return '<button class="chip" style="display:block;width:100%;text-align:left;margin:6px 0;border-radius:14px" data-act="alt" data-v="'+i+'" aria-pressed="'+(F.alt===t)+'">'+t+'</button>'}).join('')+'</div>'}
var DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],EP=false;
function planCard(open){
var w=S.weeks[WK()]||{},p=w.days||[],ws=mon(new Date()),ti=(new Date().getDay()+6)%7,n=p.length,done=0;
if(w.set&&n&&!open&&!EP){return '<div class="card"><h2>This week’s plan</h2><p>'+p.slice().sort().map(function(i){return DN[i]}).join(' · ')+'</p><p class="mu">'+(p.indexOf(ti)>-1?'Today is a planned gym day.':'Today is a planned rest day.')+'</p><button class="btn alt" data-act="pe">Change days</button></div>'}
p.forEach(function(i){if(did(iso(addD(ws,i))))done++});
var h='<div class="card"><h2>'+(ti===0&&!n?'It’s Monday: choose your gym days':'Plan your week')+'</h2><p class="mu">Pick the days you will go to the gym this week. Your goal is at least 4.</p><div class="dg">'+DN.map(function(d,i){return '<button class="chip" data-act="pd" data-v="'+i+'" aria-pressed="'+(p.indexOf(i)>-1)+'">'+d+'</button>'}).join('')+'</div>';
h+='<p class="mu" style="margin-top:10px">'+n+' day'+(n===1?'':'s')+' selected'+(n&&n<4?'. Pick at least 4 to match your goal.':'')+(n?' · Done on planned days: '+done+' of '+n:'')+'</p>';
if(!open&&n)h+='<button class="btn" data-act="pdone">Done</button>';
return h+'</div>'}
function addT(k,m,a,b,c){TRAPM[k]=m;TOPT[k]=[a,b,c]}
addT('Overgeneralization','Taking one event as a never-ending pattern, such as “I skipped once, so I always quit.”','One skipped session is one event, not a pattern.','Words like “always” and “never” are a sign I am overgeneralizing.','I can list the times I did show up.');
addT('Mental filter','Focusing on one negative detail and ignoring everything else, such as dwelling on one weak set.','What else went well today, besides the part I am stuck on?','One weak moment does not cancel the rest of my effort.','I will write down three things that went fine.');
addT('Disqualifying the positive','Dismissing good things as not counting, such as “That was only a short session.”','A short session counts. That is what my plan says.','I would count this for a friend, so I will count it for me.','Progress is progress, even when it is small.');
addT('Minimizing','Shrinking your own efforts or strengths, such as “Going four times a week is nothing special.”','Showing up consistently is a real achievement.','I would not call a friend’s effort small, so I will not call mine small.','Each session adds up over time.');
addT('Catastrophizing','Expecting the worst and blowing things out of proportion, such as “If I miss today, I will lose all my progress.”','One missed day will not undo my progress.','What is the most likely outcome, not the worst one?','If it did go badly, I could cope and get back on track.');
addT('Mind reading','Assuming you know what others think, such as “Everyone at the gym is judging me.”','I can’t read minds. Most people are focused on their own workout.','What is the actual evidence that anyone is judging me?','Even if someone noticed, it would not change my plan.');
addT('Should statements','Rigid rules about how you must behave, such as “I should be able to do this without effort.”','I can swap “should” for “I would like to” or “it would help to”.','Habits take effort for everyone. That is normal.','I will do what I can today, not what I think I should.');
addT('Labeling','Attaching a harsh label to yourself, such as “I’m lazy” or “I’m a failure.”','One behavior does not define who I am.','I am someone building a habit, and that takes practice.','I will describe what I did instead of judging who I am.');
addT('Personalization','Taking blame for things that are not fully your fault, such as “My workout buddy cancelled, so I must have done something wrong.”','Many factors are involved, not just me.','What part is actually in my control?','I can make a new plan without blaming myself.');
addT('Blaming','Putting all the responsibility on others or on circumstances, such as “I only skipped because of my schedule.”','What part can I influence, even if others played a role?','Circumstances matter, and I can still plan a backup.','I will focus on what I can change next time.');
addT('Comparison','Measuring yourself against others, such as “Everyone else is fitter than me.”','I am comparing my start to someone else’s middle.','The only comparison that matters is me versus last month.','Everyone started somewhere.');
addT('Control fallacy','Believing you have no control (“I can’t change my routine”) or total responsibility for everything (“It’s all on me”).','I can’t control everything, but I can control when I leave for the gym.','Small choices are within my control.','I will focus on the next step I can take.');
addT('Fairness fallacy','Believing things should be fair, such as “It’s not fair that I have to work this hard.”','Life is not always fair, and I can still choose my next step.','Fairness does not decide my plan. My goals do.','Effort is the price of the results I want.');
addT('Change fallacy','Expecting circumstances to change before you act, such as “I’ll go once work calms down.”','Waiting for better conditions may mean waiting forever. What can I do in the current situation?','I can adapt my plan to my real schedule.','My minimum version fits even a busy day.');
addT('Always being right','Needing to prove your view is correct, even when the evidence says otherwise.','I can be open to evidence that my prediction was wrong.','Being flexible helps more than being right.','What would change my mind?');
addT('Reward fallacy','Expecting effort to be rewarded straight away, and feeling resentful when it is not.','Results take time and are not guaranteed to be immediate.','I will track my effort, not just the outcome.','Progress often shows up later than I expect.');
addT('Tomorrow thinking','Putting things off with “I’ll start tomorrow” or “I’ll make up for it later.”','Tomorrow’s me will have the same excuses. I can do a small version now.','My plan says today, so I will do my minimum.','Starting for 10 minutes now beats a perfect start later.');
addT('Rationalizing','Making up reasonable-sounding excuses to avoid what you planned, such as “It’s too cold, so it’s better to skip.”','Is this a real obstacle, or an excuse dressed up as one?','What would I do if I had no excuse?','I can solve the obstacle instead of skipping.');
addT('Moral licensing','Feeling that a good choice earns you a pass, such as “I worked hard this week, so I deserve to skip.”','Rest days are in my plan. Today is not one.','I can reward myself without skipping the plan.','One good choice does not cancel another goal.');
addT('Low frustration tolerance','Believing discomfort is unbearable, such as “I can’t stand the first ten minutes.”','It is uncomfortable, not unbearable. It usually eases within 10 minutes.','I have done hard things before.','I can handle discomfort for the short time it takes to start.');
addT('What-if thinking','Getting stuck on endless “what if” worries, such as “What if I get injured or embarrassed?”','What is the realistic chance of that happening?','If it did happen, what would I do?','I will plan for the real risks and let the rest go.');
addT('Hopelessness','Believing nothing will help or change, such as “I never stick to anything, so why try.”','I have kept habits going before, even in small ways.','Small steps can change things over time.','I don’t need certainty, only the next small action.');
addT('Self-handicapping','Setting yourself up to fail so there is a ready excuse, such as leaving your gym bag unpacked.','I can set myself up to succeed by packing my bag tonight.','What would make this easier?','My plan includes making it easy to start.');
addT('Imposter thinking','Feeling you do not belong or are faking it, such as “I don’t belong at the gym.”','Everyone in the gym started as a beginner.','Showing up is what makes me someone who goes to the gym.','I have as much right to be here as anyone.');
addT('Hindsight bias','Believing you should have known better, such as “I should have seen this coming.”','I made the best decision I could with what I knew then.','What can I learn for next time?','Looking back is easier than looking ahead.');
function pk(t,p){return '<div class="pk"><span class="v" data-face="'+p+'"></span><input type="'+t+'" data-b="'+p+'" aria-label="'+(t==='time'?'Choose a time':'Choose a date')+'"></div>'}
function fmtF(t,v){if(!v)return t==='time'?'Tap to choose a time':'Tap to choose a date';if(t==='time'){var q=v.split(':'),h=+q[0];return ((h%12)||12)+':'+q[1]+' '+(h<12?'AM':'PM')}return new Date(v+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function paintFaces(){document.querySelectorAll('[data-face]').forEach(function(f){var i=$('[data-b="'+f.dataset.face+'"]');f.textContent=fmtF(i.type,i.value);f.className='v'+(i.value?'':' ph')})}
var TABS=[['today','Today'],['plan','Plan'],['thoughts','Thoughts'],['week','Week'],['slip','Slip'],['history','History']];

function vToday(){
var k=td(),l=S.logs[k]||{},y=S.logs[iso(addD(new Date(),-1))],h='';
h+='<h1>Today</h1><p class="mu">'+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+'</p>';
h+=planCard(false);
if(y&&y.st==='skipped'&&!did(k))h+='<div class="note w">Yesterday was skipped. Today is the day not to miss twice in a row.</div>';
h+='<div class="card"><h2>Daily log</h2><p class="mu">Fill this in on every day, including rest days and skipped days.</p>'+chips(ST,l.st,'st');
h+=sld('Motivation before (0–10)','log.before')+sld('Mood after (0–10)','log.after');
h+=fld('Notes','log.note',2);
if(S.logs[k]){h+='<label class="chk"><input type="checkbox" data-act="arm"'+(DA?' checked':'')+'>Delete today’s entry</label>';if(DA)h+='<div class="note w">This removes today’s status, ratings and notes and cannot be undone.</div><button class="btn" style="background:var(--warn);color:var(--wt)" data-act="del">Delete entry now</button>'}
h+='</div>';
h+='<div class="card" id="tmc"></div>';
return h}
function tmHTML(){
var h='<h2>The 10-minute rule</h2>';
if(T.end>Date.now()){var s=Math.max(0,Math.ceil((T.end-Date.now())/1000));
h+='<div class="tm" aria-live="off">'+Math.floor(s/60)+':'+('0'+s%60).slice(-2)+'</div><p class="mu" style="text-align:center">Do the easiest part of your plan.</p><button class="btn alt" data-act="tstop">Stop timer</button>'}
else if(T.done){h+='<div class="note"><b>10 minutes done.</b> Rate your motivation again in the log above, then choose: continue, shorten or stop. Stopping now still counts as showing up.</div><button class="btn" data-act="tstart">Start another 10 minutes</button>'}
else{h+='<p>On low-motivation days, decide only whether to <b>start</b>, not whether to finish.</p><p class="mu">1) Change into gym clothes and go. 2) Do 10 minutes of the easiest part. 3) Rate your motivation again. 4) Continue, shorten or stop.</p><button class="btn" data-act="tstart">Start 10-minute timer</button>'}
return h}
function vPlan(){
return '<h1>My plan</h1><p class="mu">Specific days, times and backups beat “I\u2019ll go when I can”.</p>'+
'<div class="card"><h2>Goal</h2><p>Go to the gym at least 4 times a week.</p>'+fld('Minimum version (the floor on bad days)','plan.min',2)+'<p class="mu">Example: a 20-minute session counts. Showing up and doing the warm-up counts.</p></div>'+
'<div class="card"><h2>If-then plans</h2><div class="f"><span>If it is this time…</span>'+pk('time','plan.time')+'</div>'+fld('…on these days, then I will leave for the gym','plan.days')+
fld('If I feel tired, then I will…','plan.tired',2)+fld('If I miss a planned session, then I will…','plan.miss',2)+'</div>'+
'<div class="card"><h2>Making it easier</h2><label class="chk"><input type="checkbox" data-b="plan.bag">Gym bag packed the night before</label><label class="chk"><input type="checkbox" data-b="plan.clothes">Clothes laid out</label>'+
fld('Workout buddy or class booked','plan.buddy')+fld('Playlist or podcast saved for gym time only','plan.list')+'</div>'+
'<p class="mu">A self-help worksheet based on standard CBT methods. It is not a substitute for care from a licensed therapist.</p>'}
function vThoughts(){
var h='<h1>Thought record</h1><p class="mu">Use this whenever you catch yourself thinking of skipping.</p>';
h+='<div class="card"><h2>Common thoughts</h2><p class="mu">Tap one to fill in the thought below.</p>'+COMMON.map(function(c,i){return '<button class="chip" style="display:block;width:100%;text-align:left;margin:6px 0" data-act="fill" data-v="'+i+'">'+c[0]+'</button>'}).join('')+'</div>';
h+='<div class="card"><h2>New record</h2>'+fld('Situation (time, place, what happened)','f.sit',2)+fld('The thought that came up','f.thought',2)+'<div class="f"><span>The thinking trap</span>'+chips(TRAPS,F.trap,'trap')+tmeaning()+'</div>'+altOpts()+fld('My balanced alternative thought','f.alt',3)+sld('Motivation after (0–10)','f.after')+'<button class="btn" data-act="tsave">Save record</button></div>';
if(S.thoughts.length){h+='<div class="card"><h2>Saved records</h2>'+S.thoughts.slice().reverse().slice(0,8).map(function(r,i){var idx=S.thoughts.length-1-i;
return '<div class="rec"><button class="x" data-act="tdel" data-v="'+idx+'" aria-label="Delete record">×</button><b>'+esc(r.thought)+'</b><br>'+(r.trap?'<span class="mu">'+esc(r.trap)+'</span><br>':'')+esc(r.alt)+'<br><span class="mu">'+esc(r.d)+(typeof r.after==='number'?' · motivation after: '+r.after:'')+'</span></div>'}).join('')+'</div>'}
return h}
function vWeek(){
var ws=mon(new Date()),pl=(S.weeks[WK()]||{}).days,n=cnt(ws),a=avgChange(),dn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],h='';
h+='<h1>Weekly review</h1><div class="card"><div class="big">'+n+' / 4</div><p class="mu">sessions this week (a short session counts)</p><div class="bar"><i style="width:'+Math.min(100,n/4*100)+'%"></i></div><div class="dots">';
for(var i=0;i<7;i++){var k=iso(addD(ws,i));h+='<div class="dot'+(did(k)?' on':'')+(k===td()?' now':'')+(pl&&pl.indexOf(i)>-1?' pl':'')+'"><i></i>'+dn[i]+'</div>'}
h+='</div>'+(pl&&pl.length?'<p class="mu">Outlined days are your planned gym days.</p>':'')+'<p><b>Streak:</b> '+streak()+' week'+(streak()===1?'':'s')+' with 4 or more sessions</p></div>';
h+=planCard(true);
h+='<div class="card"><h2>Pattern check</h2>'+(a?'<p>Average mood change (after minus before): <b>'+(a.v>0?'+':'')+a.v.toFixed(1)+'</b> across '+a.n+' day'+(a.n===1?'':'s')+'.</p><p class="mu">Most people find mood after is higher than they predicted.</p>':'<p class="mu">Rate motivation before and mood after in the daily log to see your pattern here.</p>')+'</div>';
h+='<div class="card"><h2>This week</h2>'+fld('What worked?','wk.worked',2)+fld('What got in the way?','wk.hard',2)+fld('Progress reward (non-food)','wk.reward')+'</div>';
h+='<div class="note"><b>When to seek extra support.</b> Talk to a doctor or psychologist if low motivation comes with persistent low mood, loss of interest in most activities, or exhaustion that doesn\u2019t lift. Also check in if exercise feels compulsive, you feel intense guilt after rest days, or you train through pain or injury.</div>';
return h}
function vSlip(){
var h='<h1>Slip recovery</h1><div class="note">Missing a session is information, not failure. Answer these, then book your next session before you close this page. <b>Never miss twice in a row.</b></div>';
h+='<div class="card">'+fld('What got in the way?','f.a',2)+fld('What was I thinking and feeling?','f.b',2)+fld('Was the plan unrealistic, or did a thought stop me?','f.c',2)+fld('What will I do differently next time?','f.d',2)+
'<div class="f"><span>My next session is on</span>'+pk('date','f.day')+'</div><div class="f"><span>at</span>'+pk('time','f.time')+'</div><button class="btn" data-act="ssave">Save and book next session</button></div>';
if(S.slips.length)h+='<div class="card"><h2>Earlier slips</h2>'+S.slips.slice().reverse().slice(0,5).map(function(r){return '<div class="rec"><b>'+esc(r.d)+'</b><br>'+esc(r.a)+'<br>Next: '+esc(r.day)+' '+esc(r.time)+'<br><span class="mu">Plan: '+esc(r.dd)+'</span></div>'}).join('')+'</div>';
return h}
var CM=0,DA=false,TM='',LP=false,LT=0;
function vCal(){
var n=new Date(),b=new Date(n.getFullYear(),n.getMonth()+CM,1),y=b.getFullYear(),m=b.getMonth(),dim=new Date(y,m+1,0).getDate(),off=(b.getDay()+6)%7,c={went:0,short:0,rest:0,skipped:0},cells='',i,d,k,st;
for(i=0;i<off;i++)cells+='<div></div>';
for(d=1;d<=dim;d++){k=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+d).slice(-2);st=(S.logs[k]||{}).st;if(c[st]!==undefined)c[st]++;cells+='<div class="cd '+(st||'')+(k===td()?' now':'')+'">'+d+'</div>'}
var t=c.went+c.short,h='<div class="card"><div class="cm"><button class="chip" data-act="cm" data-v="-1" aria-label="Previous month">‹</button><h2>'+b.toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</h2><button class="chip" data-act="cm" data-v="1" aria-label="Next month"'+(CM>=0?' disabled style="opacity:.4"':'')+'>›</button></div>';
h+='<p style="margin-top:12px"><span class="big">'+t+'</span> <span class="mu">day'+(t===1?'':'s')+' at the gym this month</span></p><p class="mu">Went '+c.went+' · Short session '+c.short+' · Rest day '+c.rest+' · Skipped '+c.skipped+'</p>';
h+='<div class="cal">'+['M','T','W','T','F','S','S'].map(function(x){return '<div class="cw">'+x+'</div>'}).join('')+cells+'</div>';
h+='<div class="lg"><span><i class="a"></i>Went</span><span><i class="b"></i>Short session</span><span><i></i>Rest day</span><span><i class="c"></i>Skipped</span></div></div>';
return h}
function vHistory(){
var ks=Object.keys(S.logs).sort().reverse(),L={went:'Went',short:'Short session',rest:'Rest day',skipped:'Skipped'};
var h='<h1>History</h1>'+vCal()+'<h2>All entries</h2><p class="mu">Every day you have logged, newest first.</p>';
h+='<div class="card">'+(ks.length?ks.map(function(k){var l=S.logs[k],d=new Date(k+'T12:00:00');
return '<div class="rec"><b>'+d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'</b> · '+(L[l.st]||'No status')+'<br><span class="mu">'+(typeof l.before==='number'?'Motivation before '+l.before:'')+(typeof l.after==='number'?' · Mood after '+l.after:'')+'</span>'+(l.note?'<br>'+esc(l.note):'')+'</div>'}).join(''):'<p class="mu">No days logged yet. Use the Today tab to add your first one.</p>')+'</div>';
h+='<div class="card"><h2>Backup</h2><p class="mu">Your data lives only in this browser. Copy this text and keep it somewhere safe, such as a note to yourself. To restore, paste a saved backup over the text in the box and tap Restore. Restoring replaces what is in the app now.</p><textarea id="bk" rows="5" aria-label="Backup data"></textarea><button class="btn" data-act="copy">Copy backup</button><button class="btn alt" data-act="restore">Restore from pasted backup</button><p class="mu" id="bkm"></p></div>';
return h}
var V={today:vToday,plan:vPlan,thoughts:vThoughts,week:vWeek,history:vHistory,slip:vSlip};
function val(r,k){var o=r==='plan'?S.plan:r==='f'?F:r==='log'?(S.logs[td()]||{}):(S.weeks[WK()]||{});return o[k]}
function put(r,k,v){var o=r==='plan'?S.plan:r==='f'?F:r==='log'?(S.logs[td()]=S.logs[td()]||{}):(S.weeks[WK()]=S.weeks[WK()]||{});o[k]=v}
function render(){
$('#m').innerHTML=V[tab]();
$('#nv').innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'"'+(t[0]===tab?' aria-current="true"':'')+'>'+t[1]+'</button>'}).join('');
document.querySelectorAll('[data-b]').forEach(function(el){var p=el.dataset.b.split('.'),v=val(p[0],p[1]);
if(el.type==='checkbox')el.checked=!!v;else if(el.type==='range'){if(typeof v==='number')el.value=v}else el.value=v||'';
var o=$('[data-out="'+el.dataset.b+'"]');if(o&&typeof v==='number')o.textContent=v});
if($('#tmc'))$('#tmc').innerHTML=tmHTML();
if($('#bk'))$('#bk').value=JSON.stringify(S);
paintFaces()}
function tick(){var c=$('#tmc');
if(Date.now()>=T.end){clearInterval(T.iv);T.iv=null;T.end=0;T.done=true;try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
if(c)c.innerHTML=tmHTML()}
document.addEventListener('input',hnd);document.addEventListener('change',hnd);
document.addEventListener('pointerdown',function(e){var b=e.target.closest('[data-act="trap"]');if(!b)return;LP=false;clearTimeout(LT);LT=setTimeout(function(){LP=true;TM=b.dataset.v;render()},500)});
['pointerup','pointercancel','pointerleave'].forEach(function(n){document.addEventListener(n,function(){clearTimeout(LT)},true)});
document.addEventListener('contextmenu',function(e){if(e.target.closest('[data-act="trap"]'))e.preventDefault()});
function hnd(e){var p=e.target.dataset&&e.target.dataset.b;if(!p)return;var q=p.split('.'),t=e.target,
v=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;put(q[0],q[1],v);if(q[0]!=='f')save();
var o=$('[data-out="'+p+'"]');if(o&&typeof v==='number')o.textContent=v;paintFaces()}
document.addEventListener('click',function(e){var b=e.target.closest('[data-tab],[data-act]');if(!b)return;
if(b.dataset.tab){tab=b.dataset.tab;DA=false;TM='';render();window.scrollTo(0,0);return}
var a=b.dataset.act,v=b.dataset.v;
if(a==='st'){var l=S.logs[td()]=S.logs[td()]||{};l.st=l.st===v?'':v;save();render()}
else if(a==='tstart'){T.done=false;T.end=Date.now()+6e5;clearInterval(T.iv);T.iv=setInterval(tick,500);tick()}
else if(a==='tstop'){clearInterval(T.iv);T.iv=null;T.end=0;T.done=false;tick()}
else if(a==='trap'){if(LP){LP=false;return}F.trap=F.trap===v?'':v;TM='';render()}
else if(a==='alt'){F.alt=altList()[+v];render()}
else if(a==='pe'){EP=true;render()}
else if(a==='pdone'){var w2=S.weeks[WK()]=S.weeks[WK()]||{};w2.set=true;EP=false;save();render()}
else if(a==='pd'){var w=S.weeks[WK()]=S.weeks[WK()]||{},p=w.days=w.days||[],ix=p.indexOf(+v);if(ix>-1)p.splice(ix,1);else p.push(+v);save();render()}
else if(a==='fill'){F.thought=COMMON[+v][0];F.ci=+v;F.alt='';render()}
else if(a==='tsave'){if(!(F.thought||'').trim())return;S.thoughts.push({d:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'}),sit:F.sit||'',thought:F.thought,trap:F.trap,alt:F.alt||'',after:F.after});
F={trap:'',after:5};save();render()}
else if(a==='tdel'){S.thoughts.splice(+v,1);save();render()}
else if(a==='cm'){CM=Math.min(0,CM+(+v));render()}
else if(a==='arm'){DA=!DA;render()}
else if(a==='del'){delete S.logs[td()];DA=false;save();render()}
else if(a==='copy'){var t=$('#bk'),ok=false;t.select();try{ok=document.execCommand('copy')}catch(x){}try{if(navigator.clipboard){navigator.clipboard.writeText(t.value);ok=true}}catch(x){}$('#bkm').textContent=ok?'Copied.':'Select the text above and copy it manually.'}
else if(a==='restore'){try{var o=JSON.parse($('#bk').value);if(!o||typeof o!=='object'||!o.logs)throw 0;S=o;S.plan=S.plan||{};S.logs=S.logs||{};S.thoughts=S.thoughts||[];S.weeks=S.weeks||{};S.slips=S.slips||[];save();render();$('#bkm').textContent='Restored.'}catch(x){$('#bkm').textContent='That text is not a valid backup.'}}
else if(a==='ssave'){if(!(F.a||'').trim()&&!(F.d||'').trim())return;S.slips.push({d:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'}),a:F.a||'',b:F.b||'',c:F.c||'',dd:F.d||'',day:F.day||'',time:F.time||''});
F={trap:'',after:5};save();render()}
});
var TH='',mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
try{TH=localStorage.getItem('cbt-gym-theme')||''}catch(e){}
function isDark(){var a=document.documentElement.getAttribute('data-theme');return a==='dark'||(a!=='light'&&!!mq&&mq.matches)}
function applyTheme(){var r=document.documentElement;if(TH==='light'||TH==='dark')r.setAttribute('data-theme',TH);else r.removeAttribute('data-theme');
var b=$('#tg'),d=isDark();b.textContent=d?'☀ Light mode':'☾ Dark mode';b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode')}
$('#tg').addEventListener('click',function(){TH=isDark()?'light':'dark';try{localStorage.setItem('cbt-gym-theme',TH)}catch(e){}applyTheme()});
if(mq&&mq.addEventListener)mq.addEventListener('change',applyTheme);
applyTheme();
render();
</script>
