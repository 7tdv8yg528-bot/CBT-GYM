<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBT Habit Companion — Gym, Skip Dessert & Binge Eating</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8f3fc;--sf:#ffffff;--ink:#0f2a43;--mu:#546f89;--ac:#1d76c4;--at:#1d76c4;--on:#ffffff;--soft:#d3e9fa;--ln:#b9d8f1;--ok:#1f7a5a;--warn:#a85a00;--wt:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Skip Dessert Light Theme (Warm Sage-Teal) */
:root[data-mode="dessert"]{
  --bg:#eaf5f2;--sf:#ffffff;--ink:#102e2a;--mu:#4d6f6a;--ac:#157a6e;--at:#157a6e;--on:#ffffff;--soft:#d1ebe6;--ln:#b3ddd6;--ok:#1f7a5a;--warn:#b35900;--wt:#ffffff;
}
/* Binge Eating Light Theme (Calm Berry-Plum) */
:root[data-mode="binge"]{
  --bg:#f5eef8;--sf:#ffffff;--ink:#2b1538;--mu:#6d517d;--ac:#7a3e9d;--at:#7a3e9d;--on:#ffffff;--soft:#eadbf2;--ln:#d6bce5;--ok:#1f7a5a;--warn:#b35900;--wt:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1d2d;--sf:#122f49;--ink:#e6f2fc;--mu:#9bb7cf;--ac:#5cb0f0;--at:#5cb0f0;--on:#08202f;--soft:#183c5c;--ln:#25526f;--ok:#6fd1a8;--warn:#f0b35c;--wt:#1c1500;
    color-scheme:dark;
  }
  :root[data-mode="dessert"]:not([data-theme="light"]){
    --bg:#0a1f1d;--sf:#113330;--ink:#e6f7f5;--mu:#96c2bc;--ac:#4fd1c5;--at:#4fd1c5;--on:#062320;--soft:#174440;--ln:#235c57;--ok:#6fd1a8;--warn:#f0b35c;--wt:#1c1500;
    color-scheme:dark;
  }
  :root[data-mode="binge"]:not([data-theme="light"]){
    --bg:#190e22;--sf:#271736;--ink:#f3e8fa;--mu:#bfa5cf;--ac:#c084fc;--at:#c084fc;--on:#1e0b30;--soft:#38204d;--ln:#4e2f69;--ok:#6fd1a8;--warn:#f0b35c;--wt:#1c1500;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1d2d;--sf:#122f49;--ink:#e6f2fc;--mu:#9bb7cf;--ac:#5cb0f0;--at:#5cb0f0;--on:#08202f;--soft:#183c5c;--ln:#25526f;--ok:#6fd1a8;--warn:#f0b35c;--wt:#1c1500;
  color-scheme:dark;
}
:root[data-theme="dark"][data-mode="dessert"]{
  --bg:#0a1f1d;--sf:#113330;--ink:#e6f7f5;--mu:#96c2bc;--ac:#4fd1c5;--at:#4fd1c5;--on:#062320;--soft:#174440;--ln:#235c57;--ok:#6fd1a8;--warn:#f0b35c;--wt:#1c1500;
  color-scheme:dark;
}
:root[data-theme="dark"][data-mode="binge"]{
  --bg:#190e22;--sf:#271736;--ink:#f3e8fa;--mu:#bfa5cf;--ac:#c084fc;--at:#c084fc;--on:#1e0b30;--soft:#38204d;--ln:#4e2f69;--ok:#6fd1a8;--warn:#f0b35c;--wt:#1c1500;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;transition:background-color .2s,color .2s}
html,body{background:var(--bg);color:var(--ink)}
#app{background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh}

/* Top Sticky Program Switcher + Theme Bar */
.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--sf);
  border-bottom:1px solid var(--ln);
  padding:8px 12px;
}
.topbar-in{
  max-width:560px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.mode-sw{
  display:flex;flex:1;background:var(--bg);padding:3px;border-radius:999px;border:1px solid var(--ln);gap:3px;
}
.mode-btn{
  flex:1;border:0;background:transparent;color:var(--mu);
  font:800 .8rem Nunito,system-ui,sans-serif;
  padding:8px 6px;border-radius:999px;cursor:pointer;
  min-height:38px;display:flex;align-items:center;justify-content:center;gap:4px;
  transition:all .15s;white-space:nowrap;
}
.mode-btn[aria-selected="true"]{
  background:var(--ac);color:var(--on);
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.theme-btn{
  font:700 .8rem Nunito,system-ui,sans-serif;
  color:var(--ink);background:var(--soft);border:1px solid var(--ln);
  border-radius:999px;padding:8px 12px;min-height:38px;cursor:pointer;white-space:nowrap;
}

/* Ritual Banner (Skip Dessert mode) */
.ritual-bar{
  background:var(--soft);border-bottom:1px solid var(--ln);
  padding:7px 14px;font-size:.84rem;
}
.ritual-in{
  max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.ritual-in b{color:var(--at)}
.mini-btn{
  font:800 .76rem Nunito,system-ui,sans-serif;
  background:var(--ac);color:var(--on);border:0;border-radius:999px;
  padding:5px 11px;cursor:pointer;white-space:nowrap;min-height:30px;
}

.pk{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 14px;background:var(--bg);border:1.5px solid var(--ln);border-radius:12px}
.pk .v{pointer-events:none;font-weight:600}
.pk .v.ph{color:var(--mu);font-weight:400}
.pk::after{content:"\25BE";color:var(--mu);pointer-events:none}
.pk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;margin:0;font-size:16px;cursor:pointer}
.pk:focus-within{outline:3px solid var(--at);outline-offset:1px}

main{max-width:560px;margin:0 auto;padding:8px 16px 116px}
h1{font-size:1.5rem;font-weight:800;margin:6px 0 2px;line-height:1.2}
h2{font-size:1.1rem;font-weight:800;margin:0 0 6px}
h3{font-size:.96rem;font-weight:800;margin:10px 0 4px}
p{margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:14px 0}
.f{display:block;margin:12px 0}
.f>span{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
input[type=text],input[type=number],input[type=time],input[type=date],textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;
}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--at);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font:600 .9rem Nunito,system-ui,sans-serif;color:var(--ink);background:var(--soft);
  border:1.5px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:42px;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
}
.chip.sm{font-size:.82rem;padding:6px 11px;min-height:34px}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--at)}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dg .chip{padding:9px 0;text-align:center;font-size:.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dg .chip i{width:6px;height:6px;border-radius:99px;background:transparent;display:block}
.dg .chip.has i{background:var(--at)}
.dg .chip[aria-pressed=true] i{background:var(--on)}
.dot.pl i{box-shadow:inset 0 0 0 2px var(--at)}
.btn{font:800 1rem Nunito,system-ui,sans-serif;background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:13px 18px;min-height:48px;width:100%;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--soft);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--at);height:32px}
.sl{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:.92rem}
.sl b{font-size:1.2rem;color:var(--at)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;font-weight:600;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--at)}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--sf);border-top:1px solid var(--ln);
  display:flex;gap:3px;justify-content:center;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px));
}
nav button{
  flex:1;max-width:96px;font:700 .76rem Nunito,system-ui,sans-serif;
  color:var(--mu);background:transparent;border:0;border-radius:12px;
  padding:8px 2px;min-height:46px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
nav button[aria-current=true]{background:var(--soft);color:var(--ink);font-weight:800}

.dots{display:flex;gap:6px;margin:10px 0}
.dot{flex:1;text-align:center;font-size:.78rem;color:var(--mu)}
.dot i{display:block;height:34px;border-radius:10px;background:var(--soft);margin-bottom:3px}
.dot.on i{background:var(--ac);border:2px solid var(--at)}
.dot.now{font-weight:800;color:var(--ink)}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--at);border-radius:99px}
.big{font-size:2.3rem;font-weight:800;line-height:1;color:var(--at)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat-box{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px 8px;text-align:center}
.stat-box b{display:block;font-size:1.35rem;font-weight:800;color:var(--at)}
.stat-box span{font-size:.76rem;color:var(--mu);font-weight:600}

.note{border-left:4px solid var(--at);background:var(--soft);padding:10px 12px;border-radius:0 12px 12px 0;margin:12px 0}
.note.w{border-color:var(--warn)}
.rec{border-top:1px solid var(--ln);padding:10px 0;font-size:.92rem}
.rec:first-child{border-top:0}
.tm{font-size:3rem;font-weight:800;text-align:center;color:var(--at);font-variant-numeric:tabular-nums}
.x{float:right;background:none;border:0;color:var(--mu);font-size:1.1rem;cursor:pointer;min-height:40px;min-width:40px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cw{text-align:center;font-size:.75rem;color:var(--mu);font-weight:600}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--soft);font-size:.85rem;color:var(--ink)}
.cd.went{background:var(--ac);color:var(--on);font-weight:800;border:2px solid var(--at)}
.cd.short{background:var(--sf);border:2px solid var(--at);font-weight:800}
.cd.skipped{background:var(--sf);border:2px dashed var(--warn);color:var(--warn)}
.cd.now{box-shadow:0 0 0 2px var(--ink)}
.cm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cm h2{margin:0}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mu);margin-top:10px}
.lg i{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-right:4px;background:var(--soft)}
.lg i.a{background:var(--ac);border:2px solid var(--at)}
.lg i.b{background:var(--sf);border:2px solid var(--at)}
.lg i.c{background:var(--sf);border:2px dashed var(--warn)}

/* Urge Wave Chart & Table */
.wave-box{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:8px;height:120px;padding:18px 8px 4px;
  background:var(--bg);border:1px solid var(--ln);border-radius:14px;margin:10px 0;
}
.wave-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;cursor:pointer}
.wave-col b{font-size:.78rem;color:var(--ink);margin-bottom:3px}
.wave-bar{width:100%;max-width:42px;background:var(--ac);border-radius:8px 8px 4px 4px;transition:height .25s}
.wave-col.sel .wave-bar{outline:2px solid var(--ink)}
.wave-col span{font-size:.74rem;color:var(--mu);font-weight:700;margin-top:4px}
.tbl{width:100%;table-layout:fixed;border-collapse:collapse;font-size:.83rem;margin-top:8px}
.tbl th,.tbl td{border-bottom:1px solid var(--ln);padding:8px 6px;text-align:left;vertical-align:middle;word-wrap:break-word;overflow-wrap:break-word}
.tbl th{color:var(--mu);font-weight:700;font-size:.75rem;text-transform:uppercase;line-height:1.25}
.tbl .t-col{width:20%;white-space:nowrap}
.tbl .u-col{width:18%;white-space:nowrap;text-align:center}
.tbl .b-col{width:31%}
.tbl .r-col{width:31%}

@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<div id="app">
  <!-- Sticky Top Mode Switcher & Theme Toggle -->
  <header class="topbar">
    <div class="topbar-in">
      <div class="mode-sw" role="tablist" aria-label="Choose CBT Program">
        <button type="button" class="mode-btn" id="m-gym" role="tab" aria-selected="true" data-act="mode" data-v="gym">
          <span>🏋️ Gym</span>
        </button>
        <button type="button" class="mode-btn" id="m-dessert" role="tab" aria-selected="false" data-act="mode" data-v="dessert">
          <span>🍰 Dessert</span>
        </button>
        <button type="button" class="mode-btn" id="m-binge" role="tab" aria-selected="false" data-act="mode" data-v="binge">
          <span>🥗 Binge CBT</span>
        </button>
      </div>
      <button class="theme-btn" id="tg" type="button">☾ Dark</button>
    </div>
  </header>

  <!-- Dynamic Sub-banner for Skip Dessert / Binge Eating If-Then Plan -->
  <div id="ritual-banner" style="display:none" class="ritual-bar">
    <div class="ritual-in">
      <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        <b id="ritual-lbl">My Ritual:</b> <span id="ritual-txt">Tap 4. Ritual to set your closing ritual</span>
      </div>
      <button type="button" class="mini-btn" id="ritual-btn" data-act="go-surf">🌊 Surf Urge</button>
    </div>
  </div>

  <main id="m"></main>
</div>
<nav id="nv" aria-label="Section navigation"></nav>

<script>
/* ==========================================================================
   STORAGE & STATE INITIALIZATION (Backwards-compatible with cbt-gym-v1)
   ========================================================================== */
var KEY_GYM = 'cbt-gym-v1';
var KEY_DES = 'cbt-dessert-v1';
var KEY_BIN = 'cbt-binge-v1';
var KEY_MODE = 'cbt-active-mode';

var S = {}; // Gym Habit State
var D = {}; // Skip Dessert State
var B = {}; // Binge Eating CBT State
var MODE = 'gym';

try { MODE = localStorage.getItem(KEY_MODE) || 'gym'; } catch(e) { MODE = 'gym'; }
if (MODE !== 'gym' && MODE !== 'dessert' && MODE !== 'binge') MODE = 'gym';

// Load Gym State
try { S = JSON.parse(localStorage.getItem(KEY_GYM)) || {}; } catch(e) { S = {}; }
S.plan = S.plan || {};
S.logs = S.logs || {};
S.thoughts = S.thoughts || [];
S.weeks = S.weeks || {};
S.slips = S.slips || [];

// Load Dessert State
function defaultSurfIntervals() {
  return {
    0: { urge: null, body: '', act: '' },
    5: { urge: null, body: '', act: '' },
    10: { urge: null, body: '', act: '' },
    15: { urge: null, body: '', act: '' },
    20: { urge: null, body: '', act: '' }
  };
}
var OLD_DEFAULT_IFTHEN = 'brew a cup of mint tea and step away from the table for 5 minutes';
try { D = JSON.parse(localStorage.getItem(KEY_DES)) || {}; } catch(e) { D = {}; }
D.plan = D.plan || {
  ifthen: '',
  opts: [],
  customOpts: [],
  other: '',
  hide: '',
  lunch: '',
  commonTrigger: '',
  favTrap: ''
};
if (D.plan.ifthen === OLD_DEFAULT_IFTHEN) D.plan.ifthen = '';
D.plan.opts = D.plan.opts || [];
D.plan.customOpts = D.plan.customOpts || [];
D.logs = D.logs || {};
D.thoughts = D.thoughts || [];
D.surfs = D.surfs || [];
D.surfDraft = D.surfDraft || { step: 0, lasted: '', pts: defaultSurfIntervals() };
if (!D.surfDraft.pts) D.surfDraft.pts = defaultSurfIntervals();
// Migrate any old pre-filled default numbers (7,8,6,4,2) to null if untouched
(function() {
  var p = D.surfDraft.pts;
  if (p[0] && p[0].urge === 7 && p[5] && p[5].urge === 8 && p[10] && p[10].urge === 6 && p[15] && p[15].urge === 4 && p[20] && p[20].urge === 2 &&
      !p[0].body && !p[0].act && !p[5].body && !p[5].act) {
    D.surfDraft.pts = defaultSurfIntervals();
  }
})();
D.surf = D.surfDraft;
D.weeks = D.weeks || {};
D.slips = D.slips || [];

// Load Binge Eating CBT State (Fairburn CBT-E / Overcoming Binge Eating model)
try { B = JSON.parse(localStorage.getItem(KEY_BIN)) || {}; } catch(e) { B = {}; }
B.plan = B.plan || {
  ifthen: '',
  bfast: '08:30',
  ms1: '11:00',
  lunch: '13:30',
  as1: '16:30',
  dinner: '20:00',
  es1: '',
  opts: [],
  customOpts: [],
  fearFoods: '',
  envRules: '',
  commonTrigger: '',
  favTrap: ''
};
B.plan.opts = B.plan.opts || [];
B.plan.customOpts = B.plan.customOpts || [];
B.logs = B.logs || {};
B.thoughts = B.thoughts || [];
B.surfs = B.surfs || [];
B.surfDraft = B.surfDraft || { step: 0, lasted: '', pts: defaultSurfIntervals() };
if (!B.surfDraft.pts) B.surfDraft.pts = defaultSurfIntervals();
B.weeks = B.weeks || {};
B.slips = B.slips || [];

function saveGym() { try { localStorage.setItem(KEY_GYM, JSON.stringify(S)); } catch(e) {} }
function saveDes() { try { localStorage.setItem(KEY_DES, JSON.stringify(D)); } catch(e) {} }
function saveBin() { try { localStorage.setItem(KEY_BIN, JSON.stringify(B)); } catch(e) {} }
function save() {
  if (MODE === 'gym') saveGym();
  else if (MODE === 'dessert') saveDes();
  else saveBin();
}

function $(s) { return document.querySelector(s); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function iso(d) {
  var z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4);
  return z.toISOString().slice(0, 10);
}
function td() { return iso(new Date()); }
function addD(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mon(d) { var x = new Date(d); x.setHours(12, 0, 0, 0); return addD(x, -((x.getDay() + 6) % 7)); }
function WK() { return iso(mon(new Date())); }

/* Shared UI Helpers */
function fld(l, p, rows, ph) {
  var placeholder = ph ? ' placeholder="' + esc(ph) + '"' : '';
  return '<label class="f"><span>' + l + '</span>' +
    (rows ? '<textarea rows="' + rows + '" data-b="' + p + '"' + placeholder + '></textarea>'
          : '<input type="text" data-b="' + p + '"' + placeholder + '>') + '</label>';
}
function sld(l, p, max) {
  var m = max || 10;
  var def = m === 100 ? 50 : 5;
  return '<div class="f"><div class="sl"><span>' + l + '</span><b data-out="' + p + '">—</b></div>' +
    '<input type="range" min="0" max="' + m + '" step="1" value="' + def + '" data-b="' + p + '" aria-label="' + esc(l) + '"></div>';
}
function chips(list, sel, act, small) {
  return '<div class="row">' + list.map(function(c) {
    var active = Array.isArray(sel) ? sel.indexOf(c[0]) > -1 : sel === c[0];
    return '<button type="button" class="chip' + (small ? ' sm' : '') + '" data-act="' + act + '" data-v="' + esc(c[0]) + '" aria-pressed="' + active + '">' + c[1] + '</button>';
  }).join('') + '</div>';
}
function pk(t, p) {
  return '<div class="pk"><span class="v" data-face="' + p + '"></span><input type="' + t + '" data-b="' + p + '" aria-label="' + (t === 'time' ? 'Choose a time' : 'Choose a date') + '"></div>';
}
function fmtF(t, v) {
  if (!v) return t === 'time' ? 'Tap to choose a time' : 'Tap to choose a date';
  if (t === 'time') {
    var q = v.split(':'), h = +q[0];
    return ((h % 12) || 12) + ':' + q[1] + ' ' + (h < 12 ? 'AM' : 'PM');
  }
  return new Date(v + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
function paintFaces() {
  document.querySelectorAll('[data-face]').forEach(function(f) {
    var i = $('[data-b="' + f.dataset.face + '"]');
    if (!i) return;
    f.textContent = fmtF(i.type, i.value);
    f.className = 'v' + (i.value ? '' : ' ph');
  });
}

var TRAPS = [

  ['Always being right','Always being right'],['Reward fallacy','Reward fallacy'],['Tomorrow thinking','Tomorrow thinking'],

var TRAPM = {

  'Emotional reasoning':'Treating a feeling or craving as proof of need: “I feel like I need it, so I must” or “I feel unmotivated, so I shouldn’t go.”',
  'Fortune telling':'Predicting a bad outcome as if it were certain, such as “It’ll be a bad workout.”',

var TOPT = {

  'Fortune telling':['I can’t know how it will go until I try.','I’ve been surprised by how good I feel afterwards before.','I’ll test the prediction for 10–15 minutes.'],

function addT(k,m,a,b,c){TRAPM[k]=m;TOPT[k]=[a,b,c]}
addT('Overgeneralization','Taking one event as a never-ending pattern, such as “I slipped once, so I always quit.”','One slip is one event, not a permanent pattern.','Words like “always” and “never” are a sign I am overgeneralizing.','I can list the days I did follow my plan.');
addT('Mental filter','Focusing on one negative detail and ignoring everything else.','What else went well today, besides the part I am stuck on?','One difficult moment does not cancel the rest of my effort.','I will note three things that went fine.');
addT('Disqualifying the positive','Dismissing good choices as not counting.','Every time I practice my habit, it counts.','I would count this win for a friend, so I will count it for me.','Progress is progress, even when it feels small.');
addT('Minimizing','Shrinking your own efforts or strengths.','Showing up consistently is a real achievement.','I would not call a friend’s effort small, so I will not call mine small.','Each healthy choice adds up over time.');
addT('Catastrophizing','Expecting the worst: “If I don’t eat it, the craving will never stop” or “If I miss today, I’ll lose all progress.”','Urges always peak and pass within 15–20 minutes.','What is the most realistic outcome, not the worst one?','I can ride this out for 15 minutes and reassess.');
addT('Mind reading','Assuming you know what others think.','I can’t read minds. Most people are focused on themselves.','What is the actual evidence for this assumption?','Even if someone noticed, my health goals come first.');
addT('Should statements','Rigid rules about how you must feel or behave.','I can swap “should” for “I choose to” or “it helps me to”.','Habits take practice for everyone. That is normal.','I will focus on what works today.');
addT('Labeling','Attaching a harsh label to yourself, such as “I have no willpower” or “I’m lazy.”','One urge or action does not define who I am.','I am someone rewiring a habit, and that takes practice.','I will describe the trigger instead of judging myself.');
addT('Personalization','Taking blame for things that are not fully your fault.','Many factors are involved, not just me.','What part is actually in my control right now?','I can make a fresh choice without blaming myself.');
addT('Blaming','Putting all responsibility on circumstances or others.','What part can I influence right now?','Circumstances matter, and I can still use my replacement ritual.','I will focus on what I can do differently next time.');
addT('Comparison','Measuring yourself unfairly against others.','I am comparing my practice to someone else’s highlight reel.','The only comparison that matters is my own consistency.','Everyone builds habits one day at a time.');
addT('Control fallacy','Believing you have zero control over habits or urges.','I can’t control when an urge pops up, but I can choose my closing ritual.','Small choices are within my control right now.','I will focus on the next 10 minutes.');
addT('Fairness fallacy','Believing things should feel effortless or fair: “Why can’t I eat sweets every day without consequences?”','Wishing it were different doesn’t help me reach my goal.','My goals matter more than momentary fairness complaints.','Closing my meal with tea or a walk is a kindness to my body.');
addT('Change fallacy','Waiting for life to calm down before practicing your habit.','Stressful days are the exact days my habit ritual helps most.','I can adapt my plan to my real schedule.','My replacement ritual takes less than 5 minutes.');
addT('Always being right','Insisting your initial urge thought is 100% true.','I can test whether the urge actually lasts if I wait 15 minutes.','Being curious helps more than being right.','What evidence might prove this craving thought wrong?');
addT('Reward fallacy','Expecting instant results or feeling that hard work demands a food reward.','A true reward leaves me feeling energized, not sluggish.','I will track my effort and celebrate with non-food rewards.','Progress shows up steadily over weeks.');
addT('Tomorrow thinking','Putting it off: “I’ll start skipping dessert tomorrow” or “I’ll go to the gym tomorrow.”','Tomorrow’s me will face the same cue. Practicing now builds the circuit.','My habit happens today, one meal or session at a time.','Waiting 15 minutes right now beats starting over tomorrow.');
addT('Rationalizing','Making up reasonable-sounding excuses in the moment.','Is this a genuine need, or a habit craving dressed up as logic?','What would I choose if my long-term goal decided?','I can use my replacement ritual first.');
addT('Moral licensing','Reward justification: “I worked hard / ate a healthy lunch, so I deserve dessert or a skip.”','Working hard deserves genuine rest or a break, not derailing my goal.','I can treat myself to hot tea, music, or a walk instead.','One good choice is a reason to keep going, not to undo it.');
addT('Low frustration tolerance','Believing an urge or workout start is unbearable.','An urge is uncomfortable, not unbearable. It fades like a wave.','I have ridden out cravings and tough starts before.','I can handle mild discomfort for 15 minutes.');
addT('What-if thinking','Getting stuck on “what if” worries.','What is the realistic outcome if I just test my plan?','If a problem happens, I can handle it then.','I will focus on the present step.');
addT('Hopelessness','Believing “I’ll always crave sweets” or “I never stick to anything.”','Every time I don’t reinforce the urge, the habit loop weakens.','Small repetitions rewire the brain over time.','I only need to focus on today’s choice.');
addT('Self-handicapping','Keeping tempting desserts on the counter or leaving the gym bag unpacked.','I can set my environment up to make the right choice easy.','What friction can I remove today?','Out of sight makes resisting 10x easier.');
addT('Imposter thinking','Feeling like you aren’t “the kind of person” who works out or skips sweets.','Identity follows action: each time I do the ritual, I cast a vote for the new habit.','Everyone starts as a beginner.','Showing up today is what counts.');
addT('Hindsight bias','Beating yourself up after a slip: “I should have known better.”','A slip is data for next time, not a reason for shame.','What triggered it, and how can I adjust my environment?','I return to my plan at the very next meal or day.');

  }
  if (r === 'bplan') return B.plan[k];
  if (r === 'fb') return FB[k];
  if (r === 'blog') return (B.logs[selBinDate] || {})[k];
  if (r === 'bwk') return (B.weeks[WK()] || {})[k];
  if (r === 'bsurf') {
    if (k === 'lasted') return B.surfDraft.lasted;
    var bstep = B.surfDraft.step || 0;
    return (B.surfDraft.pts[bstep] || {})[k];
  }
  return '';
}

function put(r, k, v) {
  if (r === 'plan') S.plan[k] = v;
  else if (r === 'f') F[k] = v;
  else if (r === 'log') { S.logs[td()] = S.logs[td()] || {}; S.logs[td()][k] = v; }
  else if (r === 'ghist' && k === 'date') { if (v) { selGymHistDate = v; gymHistSavedMsg = ''; } }
  else if (r === 'ghlog') { S.logs[selGymHistDate] = S.logs[selGymHistDate] || {}; S.logs[selGymHistDate][k] = v; gymHistSavedMsg = ''; }
  else if (r === 'wk') { S.weeks[WK()] = S.weeks[WK()] || {}; S.weeks[WK()][k] = v; }
  else if (r === 'dplan') D.plan[k] = v;
  else if (r === 'fd') FD[k] = v;
  else if (r === 'dlog') { D.logs[selDesDate] = D.logs[selDesDate] || {}; D.logs[selDesDate][k] = v; }
  else if (r === 'dwk') { D.weeks[WK()] = D.weeks[WK()] || {}; D.weeks[WK()][k] = v; }
  else if (r === 'surf') {
    if (k === 'lasted') D.surfDraft.lasted = v;
    else {
      var step = D.surfDraft.step || 0;
      D.surfDraft.pts[step] = D.surfDraft.pts[step] || { urge: null, body: '', act: '' };
      D.surfDraft.pts[step][k] = v;
    }
  }
  else if (r === 'bplan') B.plan[k] = v;
  else if (r === 'fb') FB[k] = v;
  else if (r === 'blog') { B.logs[selBinDate] = B.logs[selBinDate] || {}; B.logs[selBinDate][k] = v; }
  else if (r === 'bwk') { B.weeks[WK()] = B.weeks[WK()] || {}; B.weeks[WK()][k] = v; }
  else if (r === 'bsurf') {
    if (k === 'lasted') B.surfDraft.lasted = v;
    else {
      var bstep = B.surfDraft.step || 0;
      B.surfDraft.pts[bstep] = B.surfDraft.pts[bstep] || { urge: null, body: '', act: '' };
      B.surfDraft.pts[bstep][k] = v;
    }
  }
}

function updateModeChrome() {
  document.documentElement.setAttribute('data-mode', MODE);
  $('#m-gym').setAttribute('aria-selected', MODE === 'gym');
  $('#m-dessert').setAttribute('aria-selected', MODE === 'dessert');
  $('#m-binge').setAttribute('aria-selected', MODE === 'binge');
  var rb = $('#ritual-banner');
  if (MODE === 'dessert') {
    rb.style.display = 'block';
    $('#ritual-lbl').textContent = 'My Ritual:';
    var rt = (D.plan.ifthen || '').trim();
    $('#ritual-txt').textContent = rt ? ('If urge hits → ' + rt) : 'Not set yet — tap 4. Ritual to set yours';
    $('#ritual-btn').textContent = '🌊 Surf Urge';
  } else if (MODE === 'binge') {
    rb.style.display = 'block';
    $('#ritual-lbl').textContent = 'Urge Plan:';
    var bt = (B.plan.ifthen || '').trim();
    $('#ritual-txt').textContent = bt ? ('If urge hits → ' + bt) : 'Eat every 3–4h · Tap 4. Meals/Coping to set urge plan';
    $('#ritual-btn').textContent = '🌊 Pause 20m';
  } else {
    rb.style.display = 'none';
  }
}

function render() {
  updateModeChrome();
  var activeTab = MODE === 'gym' ? tabGym : (MODE === 'dessert' ? tabDes : tabBin);
  var views = MODE === 'gym' ? V_GYM : (MODE === 'dessert' ? V_DES : V_BIN);
  var tabs = MODE === 'gym' ? TABS_GYM : (MODE === 'dessert' ? TABS_DES : TABS_BIN);

  $('#m').innerHTML = views[activeTab]();
  $('#nv').innerHTML = tabs.map(function(t) {
    return '<button type="button" data-tab="' + t[0] + '"' + (t[0] === activeTab ? ' aria-current="true"' : '') + '>' + t[1] + '</button>';
  }).join('');

  document.querySelectorAll('[data-b]').forEach(function(el) {
    var p = el.dataset.b.split('.'), v = val(p[0], p[1]);
    if (el.type === 'checkbox') el.checked = !!v;
    else if (el.type === 'range') {
      if (typeof v === 'number' && !isNaN(v)) el.value = v;
      else if (el.dataset.b === 'surf.urge' || el.dataset.b === 'bsurf.urge') el.value = 0;
    }
    else el.value = v != null ? v : '';
    var o = $('[data-out="' + el.dataset.b + '"]');
    if (o) o.textContent = (typeof v === 'number' && !isNaN(v)) ? v : ((el.dataset.b === 'surf.urge' || el.dataset.b === 'bsurf.urge') ? 'Not set' : '—');
  });

  if ($('#tmc')) $('#tmc').innerHTML = tmHTMLGym();
  if ($('#stmc')) $('#stmc').innerHTML = tmHTMLDes();
  if ($('#btmc')) $('#btmc').innerHTML = tmHTMLBin();
  if ($('#bk')) $('#bk').value = JSON.stringify({ version: 'unified-v2', gym: S, dessert: D, binge: B });
  paintFaces();
}

/* Timers Tick (10-min Gym Timer, 20-min Dessert Surf Timer & 20-min Binge Pause Timer) */
function tickGym() {
  var c = $('#tmc');
  if (Date.now() >= T.end) {
    clearInterval(T.iv); T.iv = null; T.end = 0; T.done = true;
    try { navigator.vibrate && navigator.vibrate(300); } catch(e) {}
  }
  if (c) c.innerHTML = tmHTMLGym();
}
function tickDes() {
  var c = $('#stmc');
  if (Date.now() >= TS.end) {
    clearInterval(TS.iv); TS.iv = null; TS.end = 0; TS.startAt = 0; TS.done = true;
    D.surfDraft.step = 20;
    D.surfDraft.lasted = '20';
    TS.stoppedNote = '20 minutes complete — automatically recorded 20 min below.';
    saveDes();
    try { navigator.vibrate && navigator.vibrate([250, 100, 250]); } catch(e) {}
    if (MODE === 'dessert' && tabDes === 'surf') render();
    return;
  }
  if (c) c.innerHTML = tmHTMLDes();
}
function tickBin() {
  var c = $('#btmc');
  if (Date.now() >= TB.end) {
    clearInterval(TB.iv); TB.iv = null; TB.end = 0; TB.startAt = 0; TB.done = true;
    B.surfDraft.step = 20;
    B.surfDraft.lasted = '20';
    TB.stoppedNote = '20 minutes complete — automatically recorded 20 min below.';
    saveBin();
    try { navigator.vibrate && navigator.vibrate([250, 100, 250]); } catch(e) {}
    if (MODE === 'binge' && tabBin === 'surf') render();
    return;
  }
  if (c) c.innerHTML = tmHTMLBin();
}

/* Input & Interaction Listeners */
document.addEventListener('input', hnd);
document.addEventListener('change', hnd);

function hnd(e) {
  var p = e.target.dataset && e.target.dataset.b;
  if (!p) return;
  var q = p.split('.'), t = e.target;
  var v = t.type === 'checkbox' ? t.checked : t.type === 'range' ? +t.value : t.value;
  put(q[0], q[1], v);
  if (q[0] === 'ghist' && q[1] === 'date') { render(); return; }
  if (q[0] !== 'f' && q[0] !== 'fd' && q[0] !== 'fb' && q[0] !== 'ghist') save();
  var o = $('[data-out="' + p + '"]');
  if (o && typeof v === 'number') o.textContent = v;

  // Live update urge delta in Dessert Part 2
  if (p === 'fd.before' || p === 'fd.after') {
    var b = typeof FD.before === 'number' ? FD.before : 70;
    var a = typeof FD.after === 'number' ? FD.after : 25;
    var d = b - a;
    var delEl = $('#d-urge-delta');
    if (delEl) delEl.innerHTML = '<b>Urge change:</b> ' + (d > 0 ? '↓ ' + d + ' points drop (from ' + b + ' to ' + a + ')' : (d < 0 ? '↑ ' + Math.abs(d) + ' points' : 'No change (' + b + ')'));
  }
  // Live update urge delta in Binge Part 2
  if (p === 'fb.before' || p === 'fb.after') {
    var bb = typeof FB.before === 'number' ? FB.before : 80;
    var ba = typeof FB.after === 'number' ? FB.after : 30;
    var bd = bb - ba;
    var bdelEl = $('#b-urge-delta');
    if (bdelEl) bdelEl.innerHTML = '<b>Urge change:</b> ' + (bd > 0 ? '↓ ' + bd + ' points drop (from ' + bb + ' to ' + ba + ')' : (bd < 0 ? '↑ ' + Math.abs(bd) + ' points' : 'No change (' + bb + ')'));
  }
  if (p === 'dplan.ifthen' || p === 'bplan.ifthen') updateModeChrome();
  if (p === 'surf.urge' && MODE === 'dessert' && tabDes === 'surf') {
    var curStep = D.surfDraft.step || 0;
    var cols = document.querySelectorAll('.wave-col');
    var idx = SURF_STEPS.indexOf(curStep);
    if (cols[idx]) {
      cols[idx].querySelector('b').textContent = v + '/10';
      var bar = cols[idx].querySelector('.wave-bar');
      bar.style.height = Math.max(10, v * 10) + '%';
      bar.style.opacity = '1';
    }
    var cell = $('[data-urge-cell="' + curStep + '"]');
    if (cell) cell.innerHTML = '<b>' + v + '</b>';
    document.querySelectorAll('[data-act="surge-num"]').forEach(function(btn) {
      btn.setAttribute('aria-pressed', +btn.dataset.v === v);
    });
  }
  if (p === 'bsurf.urge' && MODE === 'binge' && tabBin === 'surf') {
    var bcurStep = B.surfDraft.step || 0;
    var bcols = document.querySelectorAll('.wave-col');
    var bidx = SURF_STEPS.indexOf(bcurStep);
    if (bcols[bidx]) {
      bcols[bidx].querySelector('b').textContent = v + '/10';
      var bbar = bcols[bidx].querySelector('.wave-bar');
      bbar.style.height = Math.max(10, v * 10) + '%';
      bbar.style.opacity = '1';
    }
    var bcell = $('[data-burge-cell="' + bcurStep + '"]');
    if (bcell) bcell.innerHTML = '<b>' + v + '</b>';
    document.querySelectorAll('[data-act="bsurge-num"]').forEach(function(btn) {
      btn.setAttribute('aria-pressed', +btn.dataset.v === v);
    });
  }
  paintFaces();
}

/* Long-press handler for trap meanings */
document.addEventListener('pointerdown', function(e) {
  var b = e.target.closest('[data-act="trap"],[data-act="dtrap"],[data-act="btrap"]');
  if (!b) return;
  LP = false; clearTimeout(LT);
  LT = setTimeout(function() { LP = true; TM = b.dataset.v; render(); }, 500);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(function(n) {
  document.addEventListener(n, function() { clearTimeout(LT); }, true);
});
document.addEventListener('contextmenu', function(e) {
  if (e.target.closest('[data-act="trap"],[data-act="dtrap"],[data-act="btrap"]')) e.preventDefault();
});

/* Click Actions */
document.addEventListener('click', function(e) {
  var b = e.target.closest('[data-tab],[data-act]');
  if (!b) return;

  if (b.dataset.tab) {
    if (MODE === 'gym') tabGym = b.dataset.tab;
    else if (MODE === 'dessert') tabDes = b.dataset.tab;
    else tabBin = b.dataset.tab;
    DA = false; TM = '';
    render();
    window.scrollTo(0, 0);
    return;
  }

  var a = b.dataset.act, v = b.dataset.v;

  // Mode Switcher
  if (a === 'mode') {
    MODE = v;
    try { localStorage.setItem(KEY_MODE, MODE); } catch(x) {}
    DA = false; TM = '';
    render();
    window.scrollTo(0, 0);
    return;
  }
  if (a === 'go-surf') {
    if (MODE === 'binge') tabBin = 'surf';
    else { MODE = 'dessert'; tabDes = 'surf'; }
    render();
    window.scrollTo(0, 0);
    return;
  }

  // Gym Habit Actions
  if (a === 'st') { var l = S.logs[td()] = S.logs[td()] || {}; l.st = l.st === v ? '' : v; saveGym(); render(); }
  else if (a === 'ghday') { selGymHistDate = v; gymHistSavedMsg = ''; render(); }
  else if (a === 'ghst') {
    var ghl = S.logs[selGymHistDate] = S.logs[selGymHistDate] || {};
    ghl.st = ghl.st === v ? '' : v;
    gymHistSavedMsg = '';
    saveGym(); render();
  }
  else if (a === 'ghsave') {
    S.logs[selGymHistDate] = S.logs[selGymHistDate] || {};
    gymHistSavedMsg = 'Saved historical entry for ' + new Date(selGymHistDate + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) + '.';
    saveGym(); render();
  }
  else if (a === 'ghdel') {
    delete S.logs[selGymHistDate];
    gymHistSavedMsg = 'Deleted entry for ' + new Date(selGymHistDate + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) + '.';
    saveGym(); render();
  }
  else if (a === 'tstart') { T.done = false; T.end = Date.now() + 6e5; clearInterval(T.iv); T.iv = setInterval(tickGym, 500); tickGym(); }
  else if (a === 'tstop') { clearInterval(T.iv); T.iv = null; T.end = 0; T.done = false; tickGym(); }
  else if (a === 'trap') { if (LP) { LP = false; return; } F.trap = F.trap === v ? '' : v; TM = ''; render(); }
  else if (a === 'alt') { F.alt = altListGym()[+v]; render(); }
  else if (a === 'pe') { EP = true; render(); }
  else if (a === 'pdone') { var w2 = S.weeks[WK()] = S.weeks[WK()] || {}; w2.set = true; EP = false; saveGym(); render(); }
  else if (a === 'pd') { var w = S.weeks[WK()] = S.weeks[WK()] || {}, p = w.days = w.days || [], ix = p.indexOf(+v); if (ix > -1) p.splice(ix, 1); else p.push(+v); saveGym(); render(); }
  else if (a === 'fill') { F.thought = COMMON_GYM[+v][0]; F.ci = +v; F.alt = ''; render(); }
  else if (a === 'tsave') {
    if (!(F.thought || '').trim()) return;
    S.thoughts.push({ d: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }), sit: F.sit || '', thought: F.thought, trap: F.trap, alt: F.alt || '', after: F.after });
    F = { trap: '', after: 5 }; saveGym(); render();
  }
  else if (a === 'tdel') { S.thoughts.splice(+v, 1); saveGym(); render(); }
  else if (a === 'cm') { CM = Math.min(0, CM + (+v)); render(); }
  else if (a === 'arm') { DA = !DA; render(); }
  else if (a === 'del') { delete S.logs[td()]; DA = false; saveGym(); render(); }
  else if (a === 'ssave') {
    if (!(F.a || '').trim() && !(F.d || '').trim()) return;
    S.slips.push({ d: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }), a: F.a || '', b: F.b || '', c: F.c || '', dd: F.d || '', day: F.day || '', time: F.time || '' });
    F = { trap: '', after: 5 }; saveGym(); render();
  }

  // Skip Dessert Actions
  else if (a === 'dday') { selDesDate = v; DA = false; render(); }
  else if (a === 'dst') {
    var dl = D.logs[selDesDate] = D.logs[selDesDate] || {};
    dl.st = dl.st === v ? '' : v;
    if (dl.st === 'ritual' && !dl.what) dl.what = D.plan.ifthen || 'Used replacement ritual';
    saveDes(); render();
  }
  else if (a === 'dtrig') {
    var dl2 = D.logs[selDesDate] = D.logs[selDesDate] || {};
    dl2.trig = dl2.trig === v ? '' : v;
    saveDes(); render();
  }
  else if (a === 'dmood') {
    var dl3 = D.logs[selDesDate] = D.logs[selDesDate] || {};
    dl3.mood = dl3.mood === v ? '' : v;
    saveDes(); render();
  }
  else if (a === 'ddel') { delete D.logs[selDesDate]; DA = false; saveDes(); render(); }
  else if (a === 'dfill') {
    var c = COMMON_DES[+v];
    FD.thought = c[0]; FD.trap = c[1]; FD.alt = c[2];
    render();
  }
  else if (a === 'dtrap') { if (LP) { LP = false; return; } FD.trap = FD.trap === v ? '' : v; TM = ''; render(); }
  else if (a === 'dtoggletraps') { showAllTrapsDes = !showAllTrapsDes; render(); }
  else if (a === 'dalt') { FD.alt = altListDes()[+v]; render(); }
  else if (a === 'dtsave') {
    if (!(FD.thought || '').trim() && !(FD.alt || '').trim()) return;
    D.thoughts.push({
      d: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
      sit: FD.sit || '', thought: FD.thought || '', emo: FD.emo || '',
      before: typeof FD.before === 'number' ? FD.before : 70,
      trap: FD.trap || '', evFor: FD.evFor || '', evAgainst: FD.evAgainst || '',
      alt: FD.alt || '', after: typeof FD.after === 'number' ? FD.after : 25,
      act: FD.act || ''
    });
    FD = { sit: '', thought: '', emo: '', before: 70, trap: '', evFor: '', evAgainst: '', alt: '', after: 25, act: '' };
    saveDes(); render();
  }
  else if (a === 'dtdel') { D.thoughts.splice(+v, 1); saveDes(); render(); }

  // Part 3 Urge Surfing Actions
  else if (a === 'sstart') {
    TS.done = false;
    TS.stoppedNote = '';
    TS.startAt = Date.now();
    TS.end = TS.startAt + 1200000;
    clearInterval(TS.iv);
    TS.iv = setInterval(tickDes, 500);
    tickDes();
  }
  else if (a === 'sstop') {
    var elapsedMs = TS.startAt ? (Date.now() - TS.startAt) : (TS.end ? (1200000 - Math.max(0, TS.end - Date.now())) : 0);
    var elapsedSec = Math.max(1, elapsedMs / 1000);
    var mins = elapsedSec >= 60 ? String(Math.round(elapsedSec / 60)) : String(Math.max(0.1, +(elapsedSec / 60).toFixed(1)));
    clearInterval(TS.iv); TS.iv = null; TS.end = 0; TS.startAt = 0; TS.done = false;
    D.surfDraft.lasted = mins;
    TS.stoppedNote = 'Timer stopped — automatically recorded ' + mins + ' min in the duration box below.';
    saveDes();
    render();
  }
  else if (a === 'sstep') { D.surfDraft.step = +v; saveDes(); render(); }
  else if (a === 'surge-num') {
    var stpU = D.surfDraft.step || 0;
    D.surfDraft.pts[stpU] = D.surfDraft.pts[stpU] || { urge: null, body: '', act: '' };
    D.surfDraft.pts[stpU].urge = +v;
    saveDes(); render();
  }
  else if (a === 'surclear') {
    var stpC = D.surfDraft.step || 0;
    D.surfDraft.pts[stpC] = D.surfDraft.pts[stpC] || { urge: null, body: '', act: '' };
    D.surfDraft.pts[stpC].urge = null;
    saveDes(); render();
  }
  else if (a === 'sbody') {
    var stp = D.surfDraft.step || 0;
    D.surfDraft.pts[stp] = D.surfDraft.pts[stp] || { urge: null, body: '', act: '' };
    D.surfDraft.pts[stp].body = D.surfDraft.pts[stp].body === v ? '' : v;
    saveDes(); render();
  }
  else if (a === 'sride') {
    var stp2 = D.surfDraft.step || 0;
    D.surfDraft.pts[stp2] = D.surfDraft.pts[stp2] || { urge: null, body: '', act: '' };
    D.surfDraft.pts[stp2].act = D.surfDraft.pts[stp2].act === v ? '' : v;
    saveDes(); render();
  }
  else if (a === 'ssurf-save') {
    if (TS.end > Date.now() && TS.startAt) {
      var elSec = Math.max(1, (Date.now() - TS.startAt) / 1000);
      D.surfDraft.lasted = elSec >= 60 ? String(Math.round(elSec / 60)) : String(Math.max(0.1, +(elSec / 60).toFixed(1)));
      clearInterval(TS.iv); TS.iv = null; TS.end = 0; TS.startAt = 0;
    }
    var pts = D.surfDraft.pts || defaultSurfIntervals();
    var curve = SURF_STEPS.map(function(m) {
      return (pts[m] && typeof pts[m].urge === 'number' && !isNaN(pts[m].urge)) ? pts[m].urge : '—';
    }).join(' → ');
    D.surfs.push({
      d: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
      lasted: D.surfDraft.lasted || '—',
      curve: curve,
      pts: JSON.parse(JSON.stringify(pts))
    });
    saveDes(); render();
  }
  else if (a === 'ssurf-reset') {
    clearInterval(TS.iv); TS.iv = null; TS.end = 0; TS.startAt = 0; TS.done = false; TS.stoppedNote = '';
    D.surfDraft = { step: 0, lasted: '', pts: defaultSurfIntervals() };
    D.surf = D.surfDraft;
    saveDes(); render();
  }
  else if (a === 'ssurf-del') { D.surfs.splice(+v, 1); saveDes(); render(); }

  // Part 4 Replacement Plan Options
  else if (a === 'dopt') {
    var arr = D.plan.opts = D.plan.opts || [];
    var idx = arr.indexOf(v);
    if (idx > -1) arr.splice(idx, 1); else arr.push(v);
    saveDes(); render();
  }
  else if (a === 'dopt-add') {
    var inp = $('#custom-opt-in');
    var raw = ((inp ? inp.value : FD.newOpt) || '').trim();
    if (!raw) return;
    D.plan.customOpts = D.plan.customOpts || [];
    D.plan.opts = D.plan.opts || [];
    var exists = D.plan.customOpts.some(function(x) { return x.toLowerCase() === raw.toLowerCase(); }) ||
                 RITUAL_OPTS.some(function(r) { return r[0].toLowerCase() === raw.toLowerCase(); });
    if (!exists) D.plan.customOpts.push(raw);
    if (D.plan.opts.indexOf(raw) === -1) D.plan.opts.push(raw);
    FD.newOpt = '';
    saveDes(); render();
  }
  else if (a === 'dopt-del') {
    var cIdx = +v;
    D.plan.customOpts = D.plan.customOpts || [];
    var removed = D.plan.customOpts.splice(cIdx, 1)[0];
    if (removed && D.plan.opts) {
      var oIdx = D.plan.opts.indexOf(removed);
      if (oIdx > -1) D.plan.opts.splice(oIdx, 1);
    }
    saveDes(); render();
  }

  // Part 6 Slip Save / Delete
  else if (a === 'dssave') {
    if (!(FD.sa || '').trim() && !(FD.sd || '').trim()) return;
    D.slips.push({
      d: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
      a: FD.sa || '', b: FD.sb || '', c: FD.sc || '', dd: FD.sd || ''
    });
    FD.sa = ''; FD.sb = ''; FD.sc = ''; FD.sd = '';
    saveDes(); render();
  }
  else if (a === 'dsdel') { D.slips.splice(+v, 1); saveDes(); render(); }

  // Binge Eating CBT Actions
  else if (a === 'bday') { selBinDate = v; DA = false; render(); }
  else if (a === 'bday-go') { selBinDate = v; tabBin = 'today'; DA = false; render(); window.scrollTo(0, 0); }
  else if (a === 'bmeal') {
    var blm = B.logs[selBinDate] = B.logs[selBinDate] || {};
    var marr = blm.meals = Array.isArray(blm.meals) ? blm.meals : [];
    var mix = marr.indexOf(v);
    if (mix > -1) marr.splice(mix, 1); else marr.push(v);
    saveBin(); render();
  }
  else if (a === 'bst') {
    var bl = B.logs[selBinDate] = B.logs[selBinDate] || {};
    bl.st = bl.st === v ? '' : v;
    saveBin(); render();
  }
  else if (a === 'btrig') {
    var bl2 = B.logs[selBinDate] = B.logs[selBinDate] || {};
    bl2.trig = bl2.trig === v ? '' : v;
    saveBin(); render();
  }
  else if (a === 'bmood') {
    var bl3 = B.logs[selBinDate] = B.logs[selBinDate] || {};
    bl3.mood = bl3.mood === v ? '' : v;
    saveBin(); render();
  }
  else if (a === 'bdel') { delete B.logs[selBinDate]; DA = false; saveBin(); render(); }
  else if (a === 'bfill') {
    var bc = COMMON_BIN[+v];
    FB.thought = bc[0]; FB.trap = bc[1]; FB.alt = bc[2];
    render();
  }
  else if (a === 'btrap') { if (LP) { LP = false; return; } FB.trap = FB.trap === v ? '' : v; TM = ''; render(); }
  else if (a === 'btoggletraps') { showAllTrapsBin = !showAllTrapsBin; render(); }
  else if (a === 'balt') { FB.alt = altListBin()[+v]; render(); }
  else if (a === 'btsave') {
    if (!(FB.thought || '').trim() && !(FB.alt || '').trim()) return;
    B.thoughts.push({
      d: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
      sit: FB.sit || '', thought: FB.thought || '', emo: FB.emo || '',
      before: typeof FB.before === 'number' ? FB.before : 80,
      trap: FB.trap || '', evFor: FB.evFor || '', evAgainst: FB.evAgainst || '',
      alt: FB.alt || '', after: typeof FB.after === 'number' ? FB.after : 30,
      act: FB.act || ''
    });
    FB = { sit: '', thought: '', emo: '', before: 80, trap: '', evFor: '', evAgainst: '', alt: '', after: 30, act: '', newOpt: '', sa: '', sb: '', sc: '', sd: '', se: '' };
    saveBin(); render();
  }
  else if (a === 'btdel') { B.thoughts.splice(+v, 1); saveBin(); render(); }

  // Binge Part 3 Urge Surfing Actions
  else if (a === 'bstart') {
    TB.done = false;
    TB.stoppedNote = '';
    TB.startAt = Date.now();
    TB.end = TB.startAt + 1200000;
    clearInterval(TB.iv);
    TB.iv = setInterval(tickBin, 500);
    tickBin();
  }
  else if (a === 'bstop') {
    var belapsedMs = TB.startAt ? (Date.now() - TB.startAt) : (TB.end ? (1200000 - Math.max(0, TB.end - Date.now())) : 0);
    var belapsedSec = Math.max(1, belapsedMs / 1000);
    var bmins = belapsedSec >= 60 ? String(Math.round(belapsedSec / 60)) : String(Math.max(0.1, +(belapsedSec / 60).toFixed(1)));
    clearInterval(TB.iv); TB.iv = null; TB.end = 0; TB.startAt = 0; TB.done = false;
    B.surfDraft.lasted = bmins;
    TB.stoppedNote = 'Timer stopped — automatically recorded ' + bmins + ' min in the duration box below.';
    saveBin();
    render();
  }
  else if (a === 'bstep') { B.surfDraft.step = +v; saveBin(); render(); }
  else if (a === 'bsurge-num') {
    var bstpU = B.surfDraft.step || 0;
    B.surfDraft.pts[bstpU] = B.surfDraft.pts[bstpU] || { urge: null, body: '', act: '' };
    B.surfDraft.pts[bstpU].urge = +v;
    saveBin(); render();
  }
  else if (a === 'bsurclear') {
    var bstpC = B.surfDraft.step || 0;
    B.surfDraft.pts[bstpC] = B.surfDraft.pts[bstpC] || { urge: null, body: '', act: '' };
    B.surfDraft.pts[bstpC].urge = null;
    saveBin(); render();
  }
  else if (a === 'bsbody') {
    var bstp = B.surfDraft.step || 0;
    B.surfDraft.pts[bstp] = B.surfDraft.pts[bstp] || { urge: null, body: '', act: '' };
    B.surfDraft.pts[bstp].body = B.surfDraft.pts[bstp].body === v ? '' : v;
    saveBin(); render();
  }
  else if (a === 'bsride') {
    var bstp2 = B.surfDraft.step || 0;
    B.surfDraft.pts[bstp2] = B.surfDraft.pts[bstp2] || { urge: null, body: '', act: '' };
    B.surfDraft.pts[bstp2].act = B.surfDraft.pts[bstp2].act === v ? '' : v;
    saveBin(); render();
  }
  else if (a === 'bsurf-save') {
    if (TB.end > Date.now() && TB.startAt) {
      var belSec = Math.max(1, (Date.now() - TB.startAt) / 1000);
      B.surfDraft.lasted = belSec >= 60 ? String(Math.round(belSec / 60)) : String(Math.max(0.1, +(belSec / 60).toFixed(1)));
      clearInterval(TB.iv); TB.iv = null; TB.end = 0; TB.startAt = 0;
    }
    var bpts = B.surfDraft.pts || defaultSurfIntervals();
    var bcurve = SURF_STEPS.map(function(m) {
      return (bpts[m] && typeof bpts[m].urge === 'number' && !isNaN(bpts[m].urge)) ? bpts[m].urge : '—';
    }).join(' → ');
    B.surfs.push({
      d: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
      lasted: B.surfDraft.lasted || '—',
      curve: bcurve,
      pts: JSON.parse(JSON.stringify(bpts))
    });
    saveBin(); render();
  }
  else if (a === 'bsurf-reset') {
    clearInterval(TB.iv); TB.iv = null; TB.end = 0; TB.startAt = 0; TB.done = false; TB.stoppedNote = '';
    B.surfDraft = { step: 0, lasted: '', pts: defaultSurfIntervals() };
    saveBin(); render();
  }
  else if (a === 'bsurf-del') { B.surfs.splice(+v, 1); saveBin(); render(); }

  // Binge Part 4 Coping Toolkit Options
  else if (a === 'bopt') {
    var barr = B.plan.opts = B.plan.opts || [];
    var bidx = barr.indexOf(v);
    if (bidx > -1) barr.splice(bidx, 1); else barr.push(v);
    saveBin(); render();
  }
  else if (a === 'bopt-add') {
    var binp = $('#b-custom-opt-in');
    var braw = ((binp ? binp.value : FB.newOpt) || '').trim();
    if (!braw) return;
    B.plan.customOpts = B.plan.customOpts || [];
    B.plan.opts = B.plan.opts || [];
    var bexists = B.plan.customOpts.some(function(x) { return x.toLowerCase() === braw.toLowerCase(); }) ||
                  COPING_OPTS_BIN.some(function(r) { return r[0].toLowerCase() === braw.toLowerCase(); });
    if (!bexists) B.plan.customOpts.push(braw);
    if (B.plan.opts.indexOf(braw) === -1) B.plan.opts.push(braw);
    FB.newOpt = '';
    saveBin(); render();
  }
  else if (a === 'bopt-del') {
    var bcIdx = +v;
    B.plan.customOpts = B.plan.customOpts || [];
    var bremoved = B.plan.customOpts.splice(bcIdx, 1)[0];
    if (bremoved && B.plan.opts) {
      var boIdx = B.plan.opts.indexOf(bremoved);
      if (boIdx > -1) B.plan.opts.splice(boIdx, 1);
    }
    saveBin(); render();
  }

  // Binge Part 6 Chain Analysis Save / Delete
  else if (a === 'bssave') {
    if (!(FB.sa || '').trim() && !(FB.sb || '').trim() && !(FB.sd || '').trim()) return;
    B.slips.push({
      d: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
      a: FB.sa || '', b: FB.sb || '', c: FB.sc || '', dd: FB.sd || '', e: FB.se || ''
    });
    FB.sa = ''; FB.sb = ''; FB.sc = ''; FB.sd = ''; FB.se = '';
    saveBin(); render();
  }
  else if (a === 'bsdel') { B.slips.splice(+v, 1); saveBin(); render(); }

  // Unified Backup & Restore
  else if (a === 'copy') {
    var t = $('#bk'), ok = false;
    t.select();
    try { ok = document.execCommand('copy'); } catch(x) {}
    try { if (navigator.clipboard) { navigator.clipboard.writeText(t.value); ok = true; } } catch(x) {}
    $('#bkm').textContent = ok ? 'Copied unified backup.' : 'Select the text above and copy it manually.';
  }
  else if (a === 'restore') {
    try {
      var o = JSON.parse($('#bk').value);
      if (!o || typeof o !== 'object') throw 0;
      if (o.version === 'unified-v1' || o.version === 'unified-v2' || o.gym || o.dessert || o.binge) {
        if (o.gym) {
          S = o.gym;
          S.plan = S.plan || {}; S.logs = S.logs || {}; S.thoughts = S.thoughts || []; S.weeks = S.weeks || {}; S.slips = S.slips || [];
          saveGym();
        }
        if (o.dessert) {
          D = o.dessert;
          D.plan = D.plan || { ifthen: '', opts: [], customOpts: [] };
          D.plan.opts = D.plan.opts || [];
          D.plan.customOpts = D.plan.customOpts || [];
          D.logs = D.logs || {}; D.thoughts = D.thoughts || []; D.surfs = D.surfs || [];
          D.surfDraft = D.surfDraft || { step: 0, lasted: '', pts: defaultSurfIntervals() };
          D.surf = D.surfDraft;
          D.weeks = D.weeks || {}; D.slips = D.slips || [];
          saveDes();
        }
        if (o.binge) {
          B = o.binge;
          B.plan = B.plan || { ifthen: '', opts: [], customOpts: [] };
          B.plan.opts = B.plan.opts || [];
          B.plan.customOpts = B.plan.customOpts || [];
          B.logs = B.logs || {}; B.thoughts = B.thoughts || []; B.surfs = B.surfs || [];
          B.surfDraft = B.surfDraft || { step: 0, lasted: '', pts: defaultSurfIntervals() };
          B.weeks = B.weeks || {}; B.slips = B.slips || [];
          saveBin();
        }
      } else if (o.logs) {
        S = o;
        S.plan = S.plan || {}; S.logs = S.logs || {}; S.thoughts = S.thoughts || []; S.weeks = S.weeks || {}; S.slips = S.slips || [];
        saveGym();
      } else {
        throw 0;
      }
      render();
      $('#bkm').textContent = 'Restored successfully.';
    } catch(x) {
      $('#bkm').textContent = 'That text is not a valid backup.';
    }
  }
});

/* Theme Switcher (Light / Dark) */
var TH = '', mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
try { TH = localStorage.getItem('cbt-gym-theme') || ''; } catch(e) {}
function isDark() {
  var a = document.documentElement.getAttribute('data-theme');
  return a === 'dark' || (a !== 'light' && !!mq && mq.matches);
}
function applyTheme() {
  var r = document.documentElement;
  if (TH === 'light' || TH === 'dark') r.setAttribute('data-theme', TH);
  else r.removeAttribute('data-theme');
  var b = $('#tg'), d = isDark();
  b.textContent = d ? '☀ Light' : '☾ Dark';
  b.setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode');
}
$('#tg').addEventListener('click', function() {
  TH = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('cbt-gym-theme', TH); } catch(e) {}
  applyTheme();
});
if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

applyTheme();
render();
</script>
</body>
</html>
